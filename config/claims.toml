# Fact-check claims for the medicare_checks_2026_10 case.
#
# claim_type controls which rule claim_check.py applies:
#   at_least     -- official >= claimed_value -> supported; else contradicted
#   approximately -- |official - claimed_value| / claimed_value:
#                    <= 5%  -> supported; <= 25% -> imprecise; > 25% -> contradicted
#                    denominator is claimed_value (D-34)
#   direction    -- sign(official_change) matches claimed_direction -> supported;
#                   zero change -> contradicted; opposite sign -> contradicted
#
# Each claim references a named post. Code verifies that claimed_phrase is an
# exact substring of the post's verbatim_text before applying any rule.
# If not found: verdict = not_checkable (D-35).
#
# Fields marked "TODO" are confirmed during Phase M feasibility check.


<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Two Readouts</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
            #container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                border: 1px solid #e0e0e0;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 450px;
                max-height: 70vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg.assistant {
                max-width: 100%;
            }
            .msg .content p {
                margin: 0 0 0.75rem;
            }
            .msg .content p:last-child {
                margin-bottom: 0;
            }
            .msg .content ol,
            .msg .content ul {
                margin: 0.35rem 0 0.75rem 1.25rem;
                padding: 0;
            }
            .msg .content li {
                margin: 0.45rem 0;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #999;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid #e0e0e0;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-color: #000;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #000;
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f5f5f5;
                border-left: 3px solid #f59e0b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #b45309;
            }
            button:disabled {
                opacity: 0.3;
            }
            header {
                padding: 1.25rem 1.5rem 0.5rem;
                border-bottom: 1px solid #e0e0e0;
            }
            header h1 {
                font-size: 1.25rem;
                font-weight: 650;
                margin-bottom: 0.35rem;
            }
            header p {
                color: #333;
                line-height: 1.45;
                margin-bottom: 0.75rem;
            }
            #samples {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                margin-bottom: 0.75rem;
            }
            #samples button {
                background: #fff;
                color: #000;
                border: 1px solid #ccc;
                text-transform: none;
                letter-spacing: 0;
                text-align: left;
                font-size: 0.85rem;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <header>
                <h1>Two Readouts</h1>
                <p>
                    This compares the official US and China statements about the
                    September 2026 Trump-Xi meeting, including what The Guardian
                    reported, and it fact-checks three Medicare claims from a Trump post.
                    Ask a question below, or start with one of these. A follow-up stays
                    in the same conversation.
                </p>
                <div id="samples"></div>
            </header>
            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            function renderMarkdown(text) {
                const html = marked.parse(text || "", { gfm: true, breaks: true });
                return DOMPurify.sanitize(html);
            }

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                const roleEl = document.createElement("div");
                roleEl.className = "role";
                roleEl.textContent = role;
                const content = document.createElement("div");
                content.className = "content";
                if (role === "you" || isLoading) {
                    content.textContent = text;
                } else {
                    content.innerHTML = renderMarkdown(text);
                }
                div.appendChild(roleEl);
                div.appendChild(content);
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            const sampleQuestions = [
                "Did Trump accurately describe the Medicare payments and premiums?",
                "What did The Guardian report that the official statements left out?",
                "How do the US and China statements differ on military crisis communication?",
            ];
            const samples = document.getElementById("samples");
            for (const question of sampleQuestions) {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = question;
                button.addEventListener("click", function () {
                    send(question);
                });
                samples.appendChild(button);
            }

            async function send(preset) {
                const text = (typeof preset === "string" ? preset : userInput.value).trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
                        div.appendChild(label);
                        div.appendChild(
                            document.createTextNode(
                                call.name + "(" + JSON.stringify(call.args) + ")\n→ " + call.result,
                            ),
                        );
                        messages.insertBefore(div, loading);
                    }
                    loading.querySelector(".content").innerHTML =
                        renderMarkdown(data.response);
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
